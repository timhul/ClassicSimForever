# The DW Fury profiles of every race (data/characters/dw_fury_*.yaml) against each other:
# each is simmed as is, with its own race, weapons and gear, and ranked by DPS.
# Schema: crates/csim-engine/src/sweep_loader.rs. Run with
#   cargo run --release -p csim-cli -- sweep data/sweeps/dw_fury_profiles.yaml
name: DW Fury profiles
iterations: 10000
variations:
  - characters:
      - ../characters/warrior_fury_dw_dwarf.yaml
      - ../characters/warrior_fury_dw_gnome.yaml
      - ../characters/warrior_fury_dw_human.yaml
      - ../characters/warrior_fury_dw_night_elf.yaml
      - ../characters/warrior_fury_dw_orc.yaml
      - ../characters/warrior_fury_dw_skyborne.yaml
      - ../characters/warrior_fury_dw_tauren.yaml
      - ../characters/warrior_fury_dw_troll.yaml
      - ../characters/warrior_fury_dw_undead.yaml
