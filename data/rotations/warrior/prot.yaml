# Port of ClassicSim's Rotation/Rotations/Warrior/Prot.xml.
class: WARRIOR
name: Protection
attack_mode: melee
description: Rotation that works for both Shield Slam prot and Fury Prot.
precombat_actions:
  - Bloodrage
  - Battle Shout
  - Defensive Stance
cast_if:
  - name: Berserker Rage
    condition: resource "Rage" less 50
  - name: Battle Shout
    condition: |
      buff_duration "Battle Shout" less 3
      and buff_duration "Battle Shout" less 45
  - name: Sunder Armor
    condition: |
      buff_stacks "Sunder Armor" less 5
      or buff_duration "Sunder Armor" less 4
  # General heroic strike usage
  - name: Heroic Strike
    condition: resource "Rage" greater 50
  - name: Haste  # Manual Crowd Pummeler
  - name: Kiss of the Spider
    condition: buff_duration "Death Wish" is true
  - name: Jom Gabbar
    condition: buff_duration "Death Wish" is true
  - name: Badge of the Swarmguard
    condition: buff_duration "Death Wish" is true
  - name: Slayer's Crest
    condition: buff_duration "Death Wish" is true
  - name: Earthstrike
    condition: buff_duration "Death Wish" is true
  - name: Restless Strength  # Zandalarian Hero Medallion
    condition: buff_duration "Death Wish" is true
  - name: CHUG! CHUG! CHUG! CHUG!  # Diamond Flask
    condition: buff_duration "Death Wish" is true
  - name: Heaven's Blessing  # Cloudkeeper Legplates
    condition: buff_duration "Death Wish" is true
  - name: Death Wish
    condition: |
      variable "time_remaining_encounter" less 33
      or variable "time_remaining_encounter" greater 210
  - name: Blood Fury
  - name: Eureka!
  - name: Elune's Light
  - name: Berserking
  - name: Bloodthirst
  - name: Shield Slam
  - name: Revenge
  - name: Sunder Armor
