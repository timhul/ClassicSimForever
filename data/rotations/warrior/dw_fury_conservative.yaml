# Port of ClassicSim's Rotation/Rotations/Warrior/DWFuryConservative.xml.
#
# Overpower readiness is the combo point the target's dodge grants (there is no "Overpower
# Buff" here), so `buff_duration "Overpower Buff" is true/false/greater N` became
# `variable "combo_points" greater 0` / `eq 0`. The rage dump before stancing read the swing
# timer through `spell "Mainhand Attack" less 1.5`; auto attacks are not spells here, so it is
# `variable "time_remaining_swing" less 1.5`.
class: WARRIOR
name: Fury Rage conservative stance dancing
attack_mode: melee
description: >-
  A rotation that attempts to heavily conserve rage when stance dancing. This implies fewer
  Overpowers are cast since Overpower is more likely to not always be consumed before
  proccing again, but it also implies less rage lost from stance dancing.
precombat_actions:
  - Bloodrage
  - Battle Shout
  - Berserker Stance
cast_if:
  - name: Bloodrage
    condition: resource "Rage" less 70
  - name: Berserker Rage
    condition: resource "Rage" less 50
  - name: Battle Shout
    condition: |
      buff_duration "Battle Shout" less 3
      or variable "time_remaining_execute" less 10
      and variable "time_remaining_execute" greater 0
      and buff_duration "Battle Shout" less 45
  # General heroic strike usage
  - name: Heroic Strike
    condition: |
      variable "time_remaining_execute" greater 3
      and resource "Rage" greater 50
  # Special heroic strike usage: attempt to dump rage when Overpower is up.
  - name: Heroic Strike
    condition: |
      variable "time_remaining_execute" greater 3
      and resource "Rage" greater 30
      and variable "combo_points" greater 0
      and buff_duration "Battle Stance" is false
      and variable "time_remaining_swing" less 1.5
  - name: Haste  # Manual Crowd Pummeler
  - name: Kiss of the Spider
    condition: buff_duration "Death Wish" is true
  - name: Jom Gabbar
    condition: buff_duration "Death Wish" is true
  - name: Badge of the Swarmguard
    condition: buff_duration "Death Wish" is true
  - name: Slayer's Crest
    condition: buff_duration "Death Wish" is true
  - name: Earthstrike
    condition: buff_duration "Death Wish" is true
  - name: Restless Strength  # Zandalarian Hero Medallion
    condition: buff_duration "Death Wish" is true
  - name: CHUG! CHUG! CHUG! CHUG!  # Diamond Flask
    condition: buff_duration "Death Wish" is true
  - name: Heaven's Blessing  # Cloudkeeper Legplates
    condition: buff_duration "Death Wish" is true
  - name: Death Wish
    condition: |
      variable "time_remaining_encounter" less 33
      or variable "time_remaining_execute" less 3
      or variable "time_remaining_execute" greater 180
  - name: Recklessness
    condition: |
      variable "time_remaining_execute" less 0
      or variable "time_remaining_encounter" less 20
  - name: Blood Fury
    condition: |
      variable "time_remaining_execute" less 0
      and resource "Rage" less 50
      or variable "time_remaining_execute" greater 120
  - name: Berserking
    condition: |
      variable "time_remaining_execute" less 0
      and resource "Rage" less 50
      or variable "time_remaining_execute" greater 180
  - name: Eureka!
    condition: |
      variable "time_remaining_execute" less 0
      and resource "Rage" less 50
      or variable "time_remaining_execute" greater 120
  # Always cast Execute if available (implicit condition).
  - name: Execute
  # Always cast Bloodthirst if not in Execute phase.
  - name: Bloodthirst
    condition: variable "time_remaining_execute" greater 0
  # Whirlwind only if Bloodthirst on cooldown and not in Execute phase.
  - name: Whirlwind
    condition: |
      spell "Bloodthirst" greater 1.5
      and variable "time_remaining_execute" greater 0
  # Always cast Overpower if available. The implied condition checks that the player is in
  # the correct stance, Overpower is active, etc.
  - name: Overpower
  - name: Hamstring
    condition: |
      spell "Bloodthirst" greater 1.5
      and variable "time_remaining_execute" greater 0
      and variable "combo_points" eq 0
      and resource "Rage" greater 50
      and buff_duration "Eureka!" is false
  # Switch to Battle Stance
  - name: Battle Stance
    condition: |
      variable "time_remaining_execute" greater 5
      and variable "combo_points" greater 0
      and spell "Bloodthirst" greater 3
      and resource "Rage" less 40
  - name: Berserker Stance
    condition: |
      variable "time_remaining_execute" less 0
      or variable "combo_points" eq 0
