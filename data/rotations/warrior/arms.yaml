class: WARRIOR
name: Mortal Strike
attack_mode: melee
prerequisite: Mortal Strike
description: Arms rotation.
precombat_actions:
  - Bloodrage
  - Battle Shout
  - Battle Stance
precast: Charge
cast_if:
  - name: Bloodrage
    condition: resource "Rage" less 70
  - name: Battle Shout
    condition: |
      buff_duration "Battle Shout" less 5
      or variable "time_remaining_execute" less 10
      and variable "time_remaining_execute" greater 0
      and buff_duration "Battle Shout" less 45
  - name: Sunder Armor
    condition: |
      buff_stacks "Sunder Armor" less 5
      or buff_duration "Sunder Armor" less 4
  - name: Kiss of the Spider
  - name: Jom Gabbar
  - name: Badge of the Swarmguard
  - name: Slayer's Crest
  - name: Earthstrike
  - name: Restless Strength  # Zandalarian Hero Medallion
  - name: CHUG! CHUG! CHUG! CHUG!  # Diamond Flask
  - name: Heaven's Blessing  # Cloudkeeper Legplates
  - name: Blood Fury
  - name: Eureka!
  - name: Elune's Light
  - name: Berserking
    condition: |
      variable "time_remaining_execute" less 0
      and resource "Rage" less 50
      or variable "time_remaining_execute" greater 180
  - name: Recklessness
    condition: |
      variable "time_remaining_execute" less 0
      or variable "time_remaining_encounter" less 20
  - name: Overpower
  - name: Rend
    condition: |
      buff_duration "Rend" less 1.5
      or buff_duration "Rend" is false
  - name: Mortal Strike
    condition: variable "time_remaining_execute" greater 0
  - name: Execute
  - name: Spearing Strike
    condition: |
      variable "target_is_type" eq "giant"
      and variable "time_remaining_execute" greater 0
      or variable "target_is_type" eq "dragonkin"
      and variable "time_remaining_execute" greater 0
  - name: Whirlwind
  - name: Thunder Clap
    condition: |
      resource "Rage" greater 50
      and spell "Mortal Strike" greater 1.5
  - name: Hamstring
    condition: |
      resource "Rage" greater 50
      and spell "Mortal Strike" greater 1.5
  - name: Heroic Strike
    condition: resource "Rage" greater 70
  - name: Battle Stance
    condition: |
      variable "time_remaining_execute" greater 0
      or spell "Recklessness" greater 0
  - name: Berserker Stance
    condition: |
      variable "time_remaining_execute" less 3
      and variable "combo_points" eq 0
      and spell "Mortal Strike" greater 3
      and spell "Recklessness" eq 0
