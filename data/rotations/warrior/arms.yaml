# Port of ClassicSim's Rotation/Rotations/Warrior/Arms.xml.
#
# Overpower readiness is the combo point the target's dodge grants (there is no "Overpower
# Buff" here), so `buff_duration "Overpower Buff" is false/greater N` became
# `variable "combo_points" eq 0` / `greater 0`. The rage dump before stancing read the swing
# timer through `spell "Mainhand Attack" less 1.5`; auto attacks are not spells here, so it is
# `variable "time_remaining_swing" less 1.5`.
#
# Not in ClassicSim: Rend (Battle Stance only) is refreshed in the Battle Stance window the
# Overpower swap opens, and the swap back to Berserker Stance waits for it (unless there is no
# rage for it or the execute phase is near). Rend on the target lets Bloodthrill proc.
class: WARRIOR
name: Mortal Strike
attack_mode: melee
description: A rotation for warriors with Mortal Strike.
precombat_actions:
  - Bloodrage
  - Battle Shout
  - Berserker Stance
cast_if:
  - name: Bloodrage
    condition: resource "Rage" less 70
  - name: Battle Shout
    condition: |
      buff_duration "Battle Shout" less 5
      or variable "time_remaining_execute" less 10
      and variable "time_remaining_execute" greater 0
      and buff_duration "Battle Shout" less 45
  - name: Haste  # Manual Crowd Pummeler
  - name: Kiss of the Spider
    condition: |
      variable "time_remaining_execute" greater 120
      or variable "time_remaining_execute" less 0
  - name: Jom Gabbar
    condition: |
      variable "time_remaining_execute" greater 120
      or variable "time_remaining_execute" less 0
  - name: Badge of the Swarmguard
    condition: |
      variable "time_remaining_execute" greater 120
      or variable "time_remaining_execute" less 0
  - name: Slayer's Crest
    condition: |
      variable "time_remaining_execute" greater 120
      or variable "time_remaining_execute" less 0
  - name: Earthstrike
    condition: |
      variable "time_remaining_execute" greater 120
      or variable "time_remaining_execute" less 0
  - name: Restless Strength  # Zandalarian Hero Medallion
    condition: |
      variable "time_remaining_execute" greater 120
      or variable "time_remaining_execute" less 0
  - name: CHUG! CHUG! CHUG! CHUG!  # Diamond Flask
    condition: |
      variable "time_remaining_execute" less 0
      or variable "time_remaining_encounter" less 65
  - name: Heaven's Blessing  # Cloudkeeper Legplates
    condition: |
      variable "time_remaining_execute" less 0
      or variable "time_remaining_encounter" less 65
  - name: Recklessness
    condition: |
      variable "time_remaining_execute" less 0
      or variable "time_remaining_encounter" less 20
  - name: Blood Fury
    condition: |
      variable "time_remaining_execute" less 0
      and resource "Rage" less 50
      or variable "time_remaining_execute" greater 120
  - name: Berserking
    condition: |
      variable "time_remaining_execute" less 0
      and resource "Rage" less 50
      or variable "time_remaining_execute" greater 180
  - name: Eureka!
    condition: |
      variable "time_remaining_execute" less 0
      and resource "Rage" less 50
      or variable "time_remaining_execute" greater 120
  - name: Overpower
  - name: Rend
    condition: |
      buff_duration "Rend" less 1.5
      and variable "time_remaining_execute" greater 3
  - name: Mortal Strike
    condition: variable "time_remaining_execute" greater 0
  - name: Execute
  - name: Whirlwind
    condition: spell "Mortal Strike" greater 1.5
  # Special heroic strike usage: attempt to dump rage when Overpower is up.
  - name: Heroic Strike
    condition: |
      variable "time_remaining_execute" greater 3
      and resource "Rage" greater 30
      and variable "combo_points" greater 0
      and buff_duration "Battle Stance" is false
      and variable "time_remaining_swing" less 1.5
  - name: Heroic Strike
    condition: resource "Rage" greater 65
  # Switch to Battle Stance
  - name: Battle Stance
    condition: |
      variable "time_remaining_execute" greater 5
      and variable "combo_points" greater 0
      and spell "Mortal Strike" greater 3
      and resource "Rage" less 50
  - name: Berserker Stance
    condition: |
      variable "time_remaining_execute" less 3
      and variable "combo_points" eq 0
      or variable "time_remaining_execute" less 0
      or variable "combo_points" eq 0
      and buff_duration "Rend" greater 1.5
      or variable "combo_points" eq 0
      and resource "Rage" less 10
