# Port of ClassicSim's Rotation/Rotations/Rogue/SealFateDagger.xml, for the Forever Assassination
# build: Mutilate (two combo points, more with Seal Fate's crits) instead of Backstab. Finishers
# at four or more combo points, as in the C++.
#
# Venom is left out: kept up at four or more points (80 % uptime) it adds ~19 DPS of poison
# damage but takes ~13 finishers a fight from Eviscerate, ~30 DPS less in total with
# mutilate_undead.yaml.
#
# Additions to the C++ file: the Stealth opener (Ambush), Cold Blood before an Eviscerate,
# Renataki's Charm under its spell's name (`Burst of Energy`) and Zandalarian Hero Medallion as
# `Restless Strength`.
class: ROGUE
name: Seal Fate Mutilate
attack_mode: melee
description: >-
  A rotation for Seal Fate Mutilate rogues: Mutilate to four or more combo points, Slice and
  Dice kept up, Eviscerate while Slice and Dice has more than 8 s left.
precombat_actions:
  - Stealth
cast_if:
  # Only from Stealth: the opener at the pull.
  - name: Ambush
  - name: Thistle Tea
    condition: resource "Energy" less 20
  - name: Burst of Energy  # Renataki's Charm of Trickery
    condition: resource "Energy" leq 40
  - name: Slice and Dice
    condition: buff_duration "Slice and Dice" less 3
  - name: Mutilate
    condition: variable "combo_points" less 4
  - name: Cold Blood
    condition: |
      variable "combo_points" geq 4
      and buff_duration "Slice and Dice" greater 8
  - name: Eviscerate
    condition: |
      variable "combo_points" geq 4
      and buff_duration "Slice and Dice" greater 8
  - name: Kiss of the Spider
    condition: |
      variable "time_remaining_execute" greater 120
      or variable "time_remaining_execute" less 0
  - name: Jom Gabbar
    condition: |
      variable "time_remaining_execute" greater 120
      or variable "time_remaining_execute" less 0
  - name: Badge of the Swarmguard
    condition: |
      variable "time_remaining_execute" greater 120
      or variable "time_remaining_execute" less 0
  - name: Slayer's Crest
    condition: |
      variable "time_remaining_execute" greater 120
      or variable "time_remaining_execute" less 0
  - name: Earthstrike
    condition: |
      variable "time_remaining_execute" greater 120
      or variable "time_remaining_execute" less 0
  - name: Restless Strength  # Zandalarian Hero Medallion
    condition: |
      variable "time_remaining_execute" greater 120
      or variable "time_remaining_execute" less 0
  - name: Blood Fury
    condition: |
      variable "time_remaining_execute" less 0
      and resource "Energy" less 50
      or variable "time_remaining_execute" greater 120
  - name: Berserking
    condition: |
      variable "time_remaining_execute" less 0
      and resource "Energy" less 50
      or variable "time_remaining_execute" greater 180
