class: ROGUE
name: Hemorrhage
attack_mode: melee
description: >-
  A rotation for Subtlety Hemorrhage rogues: Hemorrhage and Ghostly Strike to five combo points,
  Slice and Dice and Rupture kept up, Eviscerate at five points while both have time left.
precombat_actions:
  - Stealth
  - Premeditation
cast_if:
  # Only from Stealth: the opener at the pull.
  - name: Ambush
  - name: Thistle Tea
    condition: resource "Energy" less 10
  - name: Burst of Energy  # Renataki's Charm of Trickery
  - name: Kiss of the Spider
  - name: Jom Gabbar
  - name: Badge of the Swarmguard
  - name: Slayer's Crest
  - name: Earthstrike
  - name: Restless Strength  # Zandalarian Hero Medallion
  - name: Blood Fury
  - name: Berserking
    condition: resource "Energy" leq 40
  - name: Slice and Dice
    condition: buff_duration "Slice and Dice" less 3
  - name: Rupture
    condition: |
      variable "combo_points" eq 5
      and buff_duration "Rupture" less 2
  - name: Ghostly Strike
    condition: variable "combo_points" less 5
  - name: Hemorrhage
    condition: variable "combo_points" less 5
  - name: Eviscerate
    condition: |
      variable "combo_points" eq 5
      and buff_duration "Slice and Dice" greater 8
      and buff_duration "Rupture" greater 6