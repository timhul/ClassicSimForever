# Port of ClassicSim's Rotation/Rotations/Rogue/SealFateEA.xml (in the C++ a copy of
# SealFateDagger.xml) as the rogue's own armor debuff: Seal Fate Mutilate (seal_fate_mutilate.yaml)
# keeping Expose Armor up at five combo points, for raids without a Warrior's Sunder Armor.
# Improved Expose Armor lowers its cost and refunds two of the five points. Expose Armor and
# Sunder Armor share one armor reduction (the stronger applies), so the setup must not select
# the external Sunder Armor debuff (mutilate_ea_gnome.yaml).
#
# Additions to the C++ file: Expose Armor, the Stealth opener (Ambush), Cold Blood before an
# Eviscerate, Renataki's Charm under its spell's name (`Burst of Energy`) and Zandalarian Hero
# Medallion as `Restless Strength`.
class: ROGUE
name: Seal Fate Mutilate Expose Armor
attack_mode: melee
description: >-
  A rotation for Seal Fate Mutilate rogues providing the armor debuff: Mutilate to four or more
  combo points (five when Expose Armor is due), Slice and Dice and Expose Armor kept up,
  Eviscerate while Slice and Dice has more than 8 s left.
precombat_actions:
  - Stealth
cast_if:
  # Only from Stealth: the opener at the pull.
  - name: Ambush
  - name: Thistle Tea
    condition: resource "Energy" less 20
  - name: Burst of Energy  # Renataki's Charm of Trickery
    condition: resource "Energy" leq 40
  - name: Slice and Dice
    condition: buff_duration "Slice and Dice" less 3
  - name: Expose Armor
    condition: |
      variable "combo_points" eq 5
      and buff_duration "Expose Armor" less 3
  - name: Mutilate
    condition: |
      variable "combo_points" less 4
      or variable "combo_points" less 5
      and buff_duration "Expose Armor" less 3
  - name: Cold Blood
    condition: |
      variable "combo_points" geq 4
      and buff_duration "Slice and Dice" greater 8
      and buff_duration "Expose Armor" geq 3
  - name: Eviscerate
    condition: |
      variable "combo_points" geq 4
      and buff_duration "Slice and Dice" greater 8
      and buff_duration "Expose Armor" geq 3
  - name: Kiss of the Spider
    condition: |
      variable "time_remaining_execute" greater 120
      or variable "time_remaining_execute" less 0
  - name: Jom Gabbar
    condition: |
      variable "time_remaining_execute" greater 120
      or variable "time_remaining_execute" less 0
  - name: Badge of the Swarmguard
    condition: |
      variable "time_remaining_execute" greater 120
      or variable "time_remaining_execute" less 0
  - name: Slayer's Crest
    condition: |
      variable "time_remaining_execute" greater 120
      or variable "time_remaining_execute" less 0
  - name: Earthstrike
    condition: |
      variable "time_remaining_execute" greater 120
      or variable "time_remaining_execute" less 0
  - name: Restless Strength  # Zandalarian Hero Medallion
    condition: |
      variable "time_remaining_execute" greater 120
      or variable "time_remaining_execute" less 0
  - name: Blood Fury
    condition: |
      variable "time_remaining_execute" less 0
      and resource "Energy" less 50
      or variable "time_remaining_execute" greater 120
  - name: Berserking
    condition: |
      variable "time_remaining_execute" less 0
      and resource "Energy" less 50
      or variable "time_remaining_execute" greater 180
