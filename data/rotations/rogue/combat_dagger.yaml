class: ROGUE
name: Combat Dagger
attack_mode: melee
description: >-
  A rotation for Combat dagger rogues: Backstab to five combo points, Slice and Dice kept up,
  Eviscerate at five points while Slice and Dice has more than 8 s left.
precombat_actions:
  - Stealth
cast_if:
  # Only from Stealth: the opener at the pull.
  - name: Ambush
  - name: Thistle Tea
    condition: resource "Energy" less 10
  - name: Burst of Energy  # Renataki's Charm of Trickery
    condition: resource "Energy" leq 40
  - name: Kiss of the Spider
  - name: Jom Gabbar
  - name: Badge of the Swarmguard
  - name: Slayer's Crest
  - name: Earthstrike
  - name: Restless Strength  # Zandalarian Hero Medallion
  - name: Blood Fury
  - name: Berserking
  - name: Slice and Dice
    condition: buff_duration "Slice and Dice" less 3
  - name: Adrenaline Rush
    condition: resource "Energy" leq 60
  - name: Blade Flurry
    condition: resource "Energy" leq 60
  - name: Backstab
    # If AR is active then ignore MH swing timer
    # Else wait slightly for MH swing, unless encounter is about to end
    condition: |
      variable "combo_points" less 5
      and buff_duration "Adrenaline Rush" is true
      or variable "combo_points" less 5
      and buff_duration "Adrenaline Rush" is false
      and resource "Energy" greater 80
      and variable "time_remaining_swing" greater 1.0
      or variable "combo_points" less 5
      and variable "time_remaining_encounter" less 2.0
  - name: Eviscerate
    condition: |
      variable "combo_points" eq 5
      and buff_duration "Slice and Dice" greater 3
