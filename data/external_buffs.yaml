# External buffs and debuffs: what other players and consumables put on the character
# (`buffs`) or on the target (`debuffs`). Each entry names the aura spell it applies; the
# numbers come from that spell's record in data/spells/externals.yaml, which
# `csim-tables export-spells --externals` generates from these ids (spells another file in
# data/spells/ already carries, like the Warrior's own Sunder Armor, are not repeated there).
#
#   name      display name, unique
#   spell     SpellName.ID of the aura (the buff on the player, not the item / totem / cast)
#   faction   ALLIANCE | HORDE; absent = both
#   classes   the classes the buff is offered to; absent = every class
#   mutex     entries sharing a key exclude each other (one food, one strength elixir, ...)
#   stacks    stacks applied; absent = the spell's max stacks (Sunder Armor 5, Armor Shatter 3)
#   raid      true for a buff another raid member's class provides; `csim run --raid` leaves
#             these and every debuff out of the setups, the raid provides them or not
#
# `consumables` are items used in combat from the bags (a character's `consumables` list):
#   name      display name, unique; the rotation casts it by this name
#   item      Item.ID; `export-spells --externals` writes its use effects (spell, the item's
#             cooldown and shared category cooldown, from ItemEffect) and the spells they cast
#             into data/spells/externals.yaml
#   classes   the classes it is offered to; absent = every class
#
# World buffs (Rallying Cry, Songflower, Spirit of Zandalar, Warchief's Blessing, the
# Dire Maul tribute buffs) are left out on purpose: Forever does not offer them the same way.
# Windfury Totem is a temporary weapon enchant (data/enchants.yaml), not a buff.
# In Forever both factions get each other's buffs: Blessings, Strength of Earth and Windfury
# carry no `faction`.
# Schema: crates/csim-engine/src/buff/external.rs.

