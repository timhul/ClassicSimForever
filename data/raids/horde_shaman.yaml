# A Horde raid with Shamans: the player joins party 1 with a dual-wield Fury warrior (Battle
# Shout, Sunder Armor) and a Combat rogue, party 2 holds an Elemental and an Enhancement Shaman
# and a two-hander Fury warrior. Run with a Shaman setup as the player, e.g.
#   cargo run --release -p csim-cli -- run data/characters/shaman_enh_2h_orc.yaml --raid data/raids/horde_shaman.yaml
# Schema: crates/csim-engine/src/raid_loader.rs.
name: Horde shaman
player_party: 1
parties:
  - [warrior_fury_dw_orc, rogue_combat_axes_orc]                     # party 1, with the player
  - [shaman_ele_orc, shaman_enh_2h_orc, warrior_fury_2h_orc]         # party 2
