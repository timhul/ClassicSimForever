  - id: 450625
    note: >-
      Crusader's Wrath (Lightforge Armor 5), on white swings and spell casts; as Soulforge's: 1
      PPM instead of the table's 100 %
    proc: { ppm: 1 }
  - id: 26135
    note: >-
      Battlegear of Eternal Justice (3): 20 % chance to regain 100 mana when a Judgement lands.
      The table's type mask is harmful spells, which the judgements are not (melee defense type):
      the paladin's judgement spells instead (Righteousness, Wisdom, Light, Justice, the
      Crusader; Command; Fury)
    proc: { type_mask: [DEAL_MELEE_ABILITY], family_mask: [538444800, 512, 64, 0] }
