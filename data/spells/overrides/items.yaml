# The DUMMY effects the sim can use (Zandalarian trinkets, Arcanite Dragonling, weapon procs, ...)
# are left without a script until item spells run (TASKS 7.7 / 7.8); `csim-tables check` lists
# them. The ones below do nothing a melee sim models.

