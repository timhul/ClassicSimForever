# Hand-written overrides for the item and set bonus spells (data/spells/items.yaml, exported from
# build 1.60.1.69893 from the effects of data/items/*.yaml and the bonuses of
# data/item_sets.yaml). See crates/csim-engine/src/spell/overrides.rs for the schema.
#
# The DUMMY effects the sim can use (Zandalarian trinkets, Arcanite Dragonling, creature-type
# damage bonuses, ...) are left without a script for now; `csim-tables check` lists them.
#
# A weapon's chance-on-hit spell (ItemEffect trigger 2) carries no rate in the tables (its
# `ProcChance` is 101, "handled by the effect"): the server keeps it with the item. The rates
# below are ClassicSim's hand-authored chances for the same weapons. On-hit spells without one
# are not run: Hammer of the Northern Wind, Hammer of Expertise, Blood Talon, Phantom Blade,
# Blazing Rapier, Masterwork Stormhammer, Frostguard, Annihilator, Glacial Blade, Electrified
# Dagger, Black Amnesty, Dark Iron Rifle, Blight, Dark Iron Sunderer, Bleakwood Hew, Arcanite
# Champion, Ashbringer, Windwalker's Yari, Rot-Covered Harpoon, Hedgecutter, Keris of Zul'Serak,
# Fang of the Crystal Spider, Hurd Smasher, Venomspitter, Bloodrazor, Quel'Serrar, Corrupted
# Ashbringer, Stoneshatter and The Lobotomizer (whose Forever spell is not ClassicSim's proc).

