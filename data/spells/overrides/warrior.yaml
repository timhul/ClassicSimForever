      - { index: 2, script: NO_OP }
      - { index: 3, script: NO_OP }
  - id: 1310185
    note: Tactical Mastery (baseline) keeps 10 rage on stance change
    effects: [{ index: 0, script: STANCE_RAGE_RETAINED }]
  - id: 12295
    note: Improved Tactical Mastery adds 3-15 rage kept on stance change
    effects: [{ index: 0, script: STANCE_RAGE_RETAINED }]
  - id: 1310315
    note: Raging Blows (talent); E0 makes Whirlwind also strike with the off hand, E1 is the Cleave cost modifier
    effects: [{ index: 0, script: OFFHAND_COPY, params: { spell: 1680 } }]
  - id: 20500
    note: Improved Berserker Rage; E0 = rage (x10) gained when Berserker Rage is used, E1 = snare removal
    effects:
      - { index: 0, script: GAIN_RESOURCE_ON_USE, params: { spell: 18499, resource: RAGE } }
      - { index: 1, script: NO_OP }
  - id: 1290261
    note: Weaponmaster; the rank values go to the hidden auras the server applies, E0 (1-5 %) axe/polearm crit 12700, E1 (3-15 %) mace/staff armor penetration 12284, E2 (1-5 %) sword extra-attack chance 12281
    effects:
      - { index: 0, script: ENABLE_AURA, params: { spell: 12700, effect: 0 } }
      - { index: 1, script: ENABLE_AURA, params: { spell: 12284, effect: 0 } }
      - { index: 2, script: ENABLE_PROC, params: { spell: 12281 } }
  - id: 12700
    note: Weaponmaster's hidden crit aura; the crit only counts for attacks with axes and polearms
    effects: [{ index: 0, script: WEAPON_TYPE_CRIT_PERCENT }]
  - id: 402927
    note: Victory Rush; E2 is 15 % of attack power as damage, E1 (the heal) is a plain effect
    effects: [{ index: 2, script: ATTACK_POWER_PERCENT_DAMAGE }]
  - id: 1310222
    note: Spearing Strike; E2 adds twice the weapon damage against giants and dragonkin (the sim has no mounted targets)
    effects:
      - { index: 2, script: EXTRA_WEAPON_DAMAGE_VS_CREATURE_TYPES, params: { creature_types: [Giant, Dragonkin] } }
  - id: 440488
    note: Shockwave; E2 is 50 % of attack power as damage (frontal cone, one target here)
    effects: [{ index: 2, script: ATTACK_POWER_PERCENT_DAMAGE }]
  - id: 6343
    note: Thunder Clap r1; the damage adds 3 % of attack power (server side, BonusCoefficientFromAP is 0)
    effects: [{ index: 0, script: AP_COEFFICIENT, params: { value: 0.03 } }]
  - id: 8198
