# Hand-written Warrior spell overrides: what the client tables (data/spells/warrior.yaml, exported
# from build 1.60.1.70009) do not contain. See crates/csim-engine/src/spell/overrides.rs for the
# schema and data/SPELL_INSTRUCTIONS.md §1.7-1.9 for the table side.
#
# Spell ids are the SpellName.ID values; run `csim-tables spell <id>` to inspect one.

defaults:
  proc_hit_mask: [NORMAL, CRITICAL]

overrides:
  # ----- Procs whose hit condition retail keeps in the server-side spell_proc table -----------
  - id: 12834
    note: Deep Wounds (talent) procs on critical strikes only
    proc: { hit_mask: [CRITICAL] }
  - id: 12319
    note: Flurry (talent) procs on critical strikes only; the DUMMY carries the rank value
    proc: { hit_mask: [CRITICAL] }
    effects: [{ index: 0, script: TRIGGER_WITH_VALUE, params: { spell: 12966, effect: 0 } }]
  - id: 12317
    note: Enrage (talent) reacts to any damaging attack taken; the DUMMY carries the rank value
    effects: [{ index: 0, script: TRIGGER_WITH_VALUE, params: { spell: 12880, effect: 0 } }]
  - id: 12880
    note: the Enrage buff makes the character ENRAGED (the tables do not carry the mechanic)
    sim_flags: [ENRAGE]
  - id: 12322
    note: Unbridled Wrath (talent); the rank value 12-60 is the proc chance (ProcChance holds the max rank's 60)
    proc: { chance_effect: 0 }
  - id: 12964
    note: Unbridled Wrath payload; 1 rage, 2 with a two-hand weapon (server side)
    effects: [{ index: 0, script: TWO_HAND_ENERGIZE_MULTIPLIER, params: { value: 2 } }]
  - id: 12298
    note: Shield Specialization (talent); E1's rank value 20-100 is the chance of the rage on block
    proc: { chance_effect: 1 }
  - id: 1310316
    note: Master of Defense (talent); the rank value 50/100 is the chance of the rage on dodge/parry
    proc: { chance_effect: 0 }
  - id: 1289682
    note: Bloodthrill (talent); the rank value 4-20 is the chance, main-hand attacks against the target of your Rend only (tooltip)
    proc: { chance_effect: 0, hand: mainhand, target_aura: 772 }
  - id: 1282733
    note: Bloodthrill payload; E0 gives the Overpower combo point. E1 (aura 560, unknown) and the E2 target marker change nothing the sim models
    effects:
      - { index: 1, script: NO_OP }
      - { index: 2, script: NO_OP }

  # ----- Scripted (DUMMY) effects ------------------------------------------------------------
  - id: 12162
    note: Deep Wounds payload; the bleed lasts as long as the Deep Wound aura 412609 and adds 2 % of the attack power (server side)
    effects: [{ index: 0, script: DEEP_WOUNDS_BLEED, params: { duration_spell: 412609, value: 2 } }]
  - id: 412609
    note: Deep Wound aura; DEEP_WOUNDS_BLEED schedules the ticks itself from this spell's duration and period
    effects: [{ index: 0, script: NO_OP }]
  - id: 23881
    note: Bloodthirst r1, second effect is 35 % of attack power
    effects: [{ index: 1, script: ATTACK_POWER_PERCENT_DAMAGE }]
  - id: 23892
