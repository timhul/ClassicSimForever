# Hand-written Warrior spell overrides: what the client tables (data/spells/warrior.yaml, exported
# from build 1.60.1.69893) do not contain. See crates/csim-engine/src/spell/overrides.rs for the
# schema and data/SPELL_INSTRUCTIONS.md §1.7-1.9 for the table side.
#
# Spell ids are the SpellName.ID values; run `csim-tables spell <id>` to inspect one.

defaults:
  resource_miss_cost_mod: 0.25
  proc_hit_mask: [NORMAL, CRITICAL]

overrides:
  # ----- Procs whose hit condition retail keeps in the server-side spell_proc table -----------
  - id: 12834
    note: Deep Wounds (talent) procs on critical strikes only
    proc: { hit_mask: [CRITICAL] }
  - id: 12319
    note: Flurry (talent) procs on critical strikes only; the DUMMY carries the rank value
    proc: { hit_mask: [CRITICAL] }
    effects: [{ index: 0, script: TRIGGER_WITH_VALUE, params: { spell: 12966, effect: 0 } }]
  - id: 12317
    note: Enrage (talent) reacts to any damaging attack taken; the DUMMY carries the rank value
    effects: [{ index: 0, script: TRIGGER_WITH_VALUE, params: { spell: 12880, effect: 0 } }]

  # ----- Scripted (DUMMY) effects ------------------------------------------------------------
  - id: 12162
    note: Deep Wounds payload; the bleed lasts as long as the Deep Wound aura 412609
    effects: [{ index: 0, script: DEEP_WOUNDS_BLEED, params: { duration_spell: 412609 } }]
  - id: 23881
    note: Bloodthirst r1, second effect is 35 % of attack power
    effects: [{ index: 1, script: ATTACK_POWER_PERCENT_DAMAGE }]
  - id: 23892
    effects: [{ index: 1, script: ATTACK_POWER_PERCENT_DAMAGE }]
  - id: 23893
    effects: [{ index: 1, script: ATTACK_POWER_PERCENT_DAMAGE }]
  - id: 23894
    effects: [{ index: 1, script: ATTACK_POWER_PERCENT_DAMAGE }]
  - id: 5308
    note: Execute r1; the DUMMY holds the base damage, chain_amplitude x10 the damage per extra rage
    effects: [{ index: 0, script: EXECUTE }]
  - id: 20658
    effects: [{ index: 0, script: EXECUTE }]
  - id: 20660
    effects: [{ index: 0, script: EXECUTE }]
  - id: 20661
    effects: [{ index: 0, script: EXECUTE }]
  - id: 20662
    effects: [{ index: 0, script: EXECUTE }]
  - id: 26651
    note: hidden "just used Execute" marker, nothing to simulate
    effects: [{ index: 0, script: NO_OP }]
  - id: 12296
    note: Anger Management; E1 = rage per tick, E2 = the period in seconds, E3 = out-of-combat decay
    sim_flags: [START_OF_COMBAT]
    effects:
      - { index: 1, script: PERIODIC_RESOURCE_GAIN, params: { period_ms: 3000, resource: RAGE } }
      - { index: 2, script: NO_OP }
      - { index: 3, script: NO_OP }
  - id: 1310185
    note: Tactical Mastery (baseline) keeps 10 rage on stance change
    effects: [{ index: 0, script: STANCE_RAGE_RETAINED }]
  - id: 12295
    note: Improved Tactical Mastery adds 3-15 rage kept on stance change
    effects: [{ index: 0, script: STANCE_RAGE_RETAINED }]
  - id: 23584
    note: Dual Wield Specialization; E0 and E2 are plain auras, E1 is off-hand rage generation
    effects: [{ index: 1, script: OFFHAND_RAGE_PERCENT }]
  - id: 20500
    note: Improved Berserker Rage; E0 = rage (x10) gained when Berserker Rage is used, E1 = snare removal
    effects:
      - { index: 0, script: GAIN_RESOURCE_ON_USE, params: { spell: 18499, resource: RAGE } }
      - { index: 1, script: NO_OP }
  - id: 402927
    note: Victory Rush; E2 is 15 % of attack power as damage, E1 (the heal) is a plain effect
    effects: [{ index: 2, script: ATTACK_POWER_PERCENT_DAMAGE }]
  - id: 1310222
    note: Spearing Strike; E2 doubles the weapon damage against giants/dragonkin, not modelled
    effects: [{ index: 2, script: NO_OP }]

