# Hand-written Rogue spell overrides: what the client tables (data/spells/rogue.yaml, exported
# from build 1.60.1.70009) do not contain. See crates/csim-engine/src/spell/overrides.rs for the
# schema and data/SPELL_INSTRUCTIONS.md §1.7-1.11 for the table side.
#
# Spell ids are the SpellName.ID values; run `csim-tables spell <id>` to inspect one.
#
# Scripts the Rogue work has not implemented yet are NO_OP with the task (TASKS.md RG.n) that
# replaces them in the note, so `csim-tables check` lists nothing of the Rogue at every step.

overrides:
