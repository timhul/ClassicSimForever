  # ----- Talents ------------------------------------------------------------------------------
  # Which spells a talent proc reacts to is server data (spell_proc.SpellFamilyMask and the
  # finisher scripts): `family_mask` is a class mask of the Rogue family (Backstab 4, Garrote
  # 256, Ambush 512, Cheap Shot 1024, Expose Armor 524288, Rupture 1048576); `finisher: true`
  # makes the proc fire when a finisher spends its combo points instead of on its ProcTypeMask.
  - id: 14156
    note: Ruthlessness (talent); the rank value (20/40/60 %) is the chance on every finisher that spends its combo points, the combo point comes after the spend
    proc: { finisher: true, chance_effect: 0 }
  - id: 1224716
    note: Puncturing Wounds (talent); E1's rank value (15/30/45 %) is the chance of an extra combo point on a landed Backstab
    proc: { chance_effect: 1, family_mask: [4, 0, 0, 0] }
  - id: 13976
    note: Initiative (talent); the rank value (33/67/100 %) is the chance of an extra combo point on a landed Ambush, Garrote or Cheap Shot
    proc: { chance_effect: 0, family_mask: [1792, 0, 0, 0] }
  - id: 14168
    note: Improved Expose Armor (talent); an Expose Armor that spends at least E2's 5 combo points gets E1's 1/2 back (PROC_TRIGGER_SPELL_WITH_VALUE into the payload's combo point effect); E2 is read by the proc filter
    proc: { finisher: true, family_mask: [524288, 0, 0, 0], combo_points_effect: 2 }
    effects: [{ index: 2, script: NO_OP }]
  - id: 1310721
    note: Thousand Cuts (talent); Rupture's damaging ticks stack the energy discount 1310723 (1.9 s internal cooldown against the 2 s ticks), which the next Backstab or Hemorrhage uses up whole
    proc: { family_mask: [1048576, 0, 0, 0] }
