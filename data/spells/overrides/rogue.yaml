  # and the per-point damage / armor is EffectPointsPerResource; the DUMMYs carry no number. The
  # attack power shares are only in the descriptions: COMBO_POINT_AP_DAMAGE with the TASKS
  # decision 2 values, which are unverified defaults (Eviscerate 3 % AP per point from
  # ClassicSim; Rupture 4/10/18/21/24 % AP over the ticks from cMaNGOS / TBC).
  - id: 5171
    note: Slice and Dice r1; E0 is the per-combo-point duration (duration_per_resource_ms)
    effects: [{ index: 0, script: NO_OP }]
