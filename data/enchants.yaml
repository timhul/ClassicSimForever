  slots: [MAINHAND]
  procs:
    - name: WINDFURY_ATTACK
      display_name: Windfury Totem Attack
      # Windfury Totem Passive (Rank 3): a 20 % chance on a main-hand hit to cast 10610, which
      # grants the extra attack and the two-charge attack power aura. The record decides the
      # chance, the internal cooldown and the attack power (246 in the Forever tables); the
      # `rate` and `value` below are the Classic numbers ClassicSim was authored with.
      spell: 10612
      rate: 0.2
      value: 315

# Rogue poisons: the SpellItemEnchantment row gives the chance, the payload and the charges
# (exported into data/spells/enchants.yaml). The highest ranks; Wound and Crippling Poison deal
# no damage to a boss and are left out, the SoD poisons are not offered (TASKS.md decision 1).
- name: InstantPoison
  display_name: Instant Poison VI
  unique_name: Instant Poison
