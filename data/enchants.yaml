# Enchant definitions. Ported from ClassicSim's EnchantName.cpp / EnchantStatic.cpp /
# EnchantProc.cpp / CharacterEnchants.cpp.
#
# Stat values use the item data semantics: chances are fractions (0.01 = 1%), speeds are
# percentages, everything else is a flat amount. `weapon_damage` is added to the enchanted weapon
# only. Procs use the same schema as item procs; `ppm: true` makes `rate` procs-per-minute.
#
# Which enchants a class can pick per slot is class data (data/classes/*.yaml); this file only
# describes what an enchant does and where it can physically go.

# ---------------------------------------------------------------- weapon enchants (permanent)

- name: Crusader
  display_name: Crusader
  unique_name: Enchant Weapon - Crusader
  effect: Crusader
  slots: [MAINHAND, OFFHAND]
  weapon_slots: [1H, MH, OH, 2H]
  procs:
    - name: GENERIC_STAT_BUFF
      display_name: Holy Strength
      stat: STRENGTH
      amount: 100
      duration: 15
      rate: 1.0
      ppm: true

