[workspace]
resolver = "2"
members = ["crates/csim-engine", "crates/csim-cli", "crates/csim-tables"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0"
repository = "https://github.com/timhul/ClassicSimForever"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
thiserror = "2"
approx = "0.5"
csv = "1"
clap = { version = "4", features = ["derive"] }
