[package]
name = "csim-live"
description = "Watch one iteration of ClassicSimForever unfold in real time in a browser, or simulate many"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "csim-live"
path = "src/main.rs"
required-features = ["server"]

[features]
default = ["server"]
# The native HTTP server and its command line; the browser build goes without.
server = ["dep:clap", "dep:tiny_http"]

[dependencies]
csim-engine = { path = "../csim-engine" }
clap = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
tiny_http = { workspace = true, optional = true }
