<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>csim-live</title>
<style>
  :root {
    --bg: #111317;
    --panel: #1a1d23;
    --line: #2a2e36;
    --text: #d8dbe0;
    --muted: #8a909b;
    --white-hit: #ffffff;
    --yellow-hit: #ffd100;
    --proc-hit: #7cc4ff;
    --rage: #c0392b;
    --energy: #e6c229;
    --mana: #2f6fd6;
    --focus: #d2802a;
    --swing: #5aa469;
    --accent: #e0b04a;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header, #controls, main, footer { padding: 0 16px; }
  header {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px 24px;
    padding-top: 14px;
  }
  h1 { font-size: 20px; margin: 0; font-weight: 600; }
  h2 {
    font-size: 12px;
    margin: 0 0 8px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-weight: 600;
  }
  #sub { color: var(--muted); }
  #totals { font-variant-numeric: tabular-nums; }
  #dps { font-size: 22px; font-weight: 700; color: var(--accent); }
  #controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    margin: 12px 0 8px;
  }
  button, select {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 6px 12px;
    font: inherit;
    cursor: pointer;
  }
  button:hover:not(:disabled), select:hover { border-color: var(--muted); }
  button:disabled { opacity: 0.4; cursor: default; }
  #play { min-width: 76px; font-weight: 600; }
  #clock {
    margin-left: auto;
    font: 600 18px/1 ui-monospace, "Cascadia Mono", Consolas, monospace;
    font-variant-numeric: tabular-nums;
  }
  #last-event { color: var(--muted); min-width: 140px; text-align: right; }
  #timeline {
    height: 4px;
    background: var(--line);
    margin: 0 16px 16px;
    border-radius: 2px;
    overflow: hidden;
  }
  #timeline-fill { height: 100%; width: 0; background: var(--accent); }
  main {
    display: grid;
    grid-template-columns: minmax(160px, 260px) minmax(0, 1fr);
    grid-template-areas: "feed state" "feed rotation";
    gap: 16px;
    align-items: start;
  }
  #feed-panel { grid-area: feed; }
  #state { grid-area: state; }
  #rotation-panel { grid-area: rotation; }
  @media (min-width: 1200px) {
    main {
      grid-template-columns: minmax(160px, 240px) minmax(0, 1fr) minmax(300px, 380px);
      grid-template-areas: "feed state rotation";
    }
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 12px;
  }
  #feed-panel { height: calc(100vh - 150px); min-height: 240px; display: flex; flex-direction: column; }
  #feed {
    list-style: none;
    margin: 0;
    padding: 0;
    overflow: hidden;
    flex: 1;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 1px 2px #000, 0 0 1px #000;
  }
  #feed li {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 16px;
    line-height: 1.5;
    animation: pop 0.25s ease-out;
  }
  #feed li.auto { color: var(--white-hit); }
  #feed li.spell { color: var(--yellow-hit); }
  #feed li.crit { font-size: 22px; }
  #feed li.miss { font-style: italic; }
  #feed li.proc { color: var(--proc-hit); font-size: 13px; }
  @keyframes pop { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
  #stage {
    position: relative;
    height: 240px;
    overflow: hidden;
    background: #000;
    border-radius: 8px;
    border: 1px solid var(--line);
  }
  .float {
    position: absolute;
    left: 50%;
    top: var(--y);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    pointer-events: none;
    text-shadow: 0 0 2px #000, 0 0 3px #000;
    transform: translate(-50%, -50%);
  }
  .float.auto { color: var(--white-hit); }
  .float.spell { color: var(--yellow-hit); }
  .float.miss { font-style: italic; }
  .float.hit { font-size: 18px; animation: slide 1.5s ease-out forwards; }
  .float.crit { font-size: 40px; animation: crit 3s ease-out forwards; }
  #stage.paused .float { animation-play-state: paused; }
  /* A hit slides from the middle out to one side (--dx), fading on the way. */
  @keyframes slide {
    from { opacity: 1; transform: translate(-50%, -50%); }
    70% { opacity: 1; }
    to { opacity: 0; transform: translate(calc(-50% + var(--dx)), -50%); }
  }
  /* A crit pops in, stays in the middle and fades out. */
  @keyframes crit {
    from { opacity: 0; transform: translate(-50%, -50%) scale(1.8); }
    6% { opacity: 1; transform: translate(-50%, -50%) scale(0.95); }
    10% { transform: translate(-50%, -50%) scale(1); }
    40% { opacity: 1; }
    to { opacity: 0; transform: translate(-50%, -50%) scale(1); }
  }
  #state { display: grid; gap: 16px; }
  .row { display: grid; grid-template-columns: 124px minmax(0, 1fr) 64px; gap: 8px; align-items: center; }
  .row + .row { margin-top: 6px; }
  .label { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .icon {
    width: 18px;
    height: 18px;
    flex: none;
    border-radius: 3px;
    box-shadow: 0 0 0 1px #000;
  }
  .value { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .bar { height: 14px; background: var(--line); border-radius: 3px; overflow: hidden; }
  .bar > div { height: 100%; width: 0; }
  .bar.big { height: 20px; }
  #pips { display: flex; gap: 6px; }
  .pip { width: 16px; height: 16px; border-radius: 50%; border: 1px solid var(--muted); }
  .pip.on { background: var(--accent); border-color: var(--accent); }
  #stance { font-weight: 600; }
  .lists { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
  .empty { color: var(--muted); }
  .tiles { display: flex; flex-wrap: wrap; gap: 6px; }
  .tile {
    position: relative;
    width: 36px;
    height: 36px;
    border-radius: 4px;
    overflow: hidden;
    background: #1b1e24;
    box-shadow: 0 0 0 1px #000;
  }
  .tile img { display: block; width: 100%; height: 100%; }
  .tile .initials {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    color: var(--muted);
    font-size: 12px;
    font-weight: 600;
  }
  .tile .sweep { position: absolute; inset: 0; }
  .tile .left, .tile .count {
    position: absolute;
    color: #fff;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 0 2px #000, 0 0 2px #000, 0 0 3px #000;
  }
  .tile .left { inset: 0; display: grid; place-items: center; font-size: 13px; }
  .tile .count { right: 2px; bottom: 0; font-size: 11px; line-height: 1.2; }
  footer { color: #e06c6c; padding-top: 8px; padding-bottom: 16px; min-height: 1.4em; }
  #rotation-panel {
    display: flex;
    flex-direction: column;
    max-height: calc(100vh - 150px);
    min-height: 240px;
  }
  #entries { margin-bottom: 10px; }
  #entries summary {
    cursor: pointer;
    color: var(--muted);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .entries, #decisions {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    gap: 2px;
    align-content: start;
  }
  .entries { margin-top: 8px; max-height: 40vh; overflow-y: auto; position: relative; }
  #decisions { flex: 1; overflow-y: auto; min-height: 0; }
  .entry, .decision {
    display: grid;
    grid-template-columns: 64px 18px minmax(0, 1fr);
    gap: 2px 6px;
    align-items: center;
    padding: 4px 6px;
    border-radius: 4px;
  }
  .entry { grid-template-columns: 2.4em 18px minmax(0, 1fr); }
  .entry.skipped { opacity: 0.45; }
  .entry.latest, .decision.newest {
    background: rgba(224, 176, 74, 0.12);
    box-shadow: inset 0 0 0 1px rgba(224, 176, 74, 0.45);
  }
  .decision.newest { animation: pop 0.25s ease-out; }
  .slot { width: 18px; height: 18px; display: flex; }
  .when {
    color: var(--muted);
    font: 12px/1 ui-monospace, "Cascadia Mono", Consolas, monospace;
    font-variant-numeric: tabular-nums;
  }
  .spell { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .position { color: var(--accent); font-weight: 600; font-variant-numeric: tabular-nums; }
  .spell .position { margin-left: 6px; }
  .condition {
    grid-column: 3;
    margin: 0;
    color: var(--muted);
    font: 12px/1.35 ui-monospace, "Cascadia Mono", Consolas, monospace;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  @media (max-width: 640px) {
    main { grid-template-columns: minmax(0, 1fr); grid-template-areas: "feed" "state" "rotation"; }
    #feed-panel { height: 240px; }
    #clock { margin-left: 0; }
    #last-event { text-align: left; }
  }
</style>
</head>
<body>
<header>
  <div>
    <h1 id="name">csim-live</h1>
    <div id="sub"></div>
  </div>
  <div id="totals"><span id="dps">0.0</span> DPS &middot; <span id="total">0</span> damage</div>
</header>

<div id="controls">
  <button id="play" type="button">Play</button>
  <select id="speed" aria-label="Speed">
    <option value="0.1">0.1×</option>
    <option value="0.25">0.25×</option>
    <option value="0.5">0.5×</option>
    <option value="1" selected>1×</option>
    <option value="2">2×</option>
    <option value="5">5×</option>
    <option value="10">10×</option>
    <option value="50">50×</option>
  </select>
  <button id="step-event" type="button">Step event</button>
  <button id="step-cast" type="button">Step to cast</button>
  <button id="restart" type="button">Restart</button>
  <button id="reseed" type="button">New seed</button>
  <span id="last-event"></span>
  <span id="clock">0:00.000</span>
</div>
<div id="timeline"><div id="timeline-fill"></div></div>

<main>
  <section id="feed-panel" class="panel">
    <h2>Damage</h2>
    <ol id="feed"></ol>
  </section>

  <section id="state">
    <div id="stage" class="paused"></div>
    <div class="panel">
      <h2 id="resource-name">Resource</h2>
      <div class="row">
        <span class="label" id="resource-label"></span>
        <div class="bar big"><div id="resource-fill"></div></div>
        <span class="value" id="resource-value"></span>
      </div>
      <div class="row" id="pips-row" hidden>
        <span class="label">Combo points</span>
        <div id="pips"></div>
        <span class="value" id="pips-value"></span>
      </div>
      <div class="row" id="stance-row" hidden>
        <span class="label">Stance</span>
        <span id="stance"></span>
        <span></span>
      </div>
    </div>

    <div class="panel">
      <h2>Timers</h2>
      <div class="row">
        <span class="label">Main hand</span>
        <div class="bar"><div id="mh-fill" style="background: var(--swing)"></div></div>
        <span class="value" id="mh-value"></span>
      </div>
      <div class="row" id="oh-row">
        <span class="label">Off hand</span>
        <div class="bar"><div id="oh-fill" style="background: var(--swing)"></div></div>
        <span class="value" id="oh-value"></span>
      </div>
    </div>

    <div class="lists">
      <div class="panel">
        <h2>Cooldowns</h2>
        <div id="cooldowns" class="tiles"></div>
      </div>
      <div class="panel">
        <h2>Buffs</h2>
        <div id="buffs" class="tiles"></div>
      </div>
    </div>
  </section>

  <section id="rotation-panel" class="panel">
    <h2>Rotation</h2>
    <details id="entries">
      <summary>cast_if entries (<span id="entries-count">0</span>)</summary>
      <ol id="entries-list" class="entries"></ol>
    </details>
    <ol id="decisions"></ol>
  </section>
</main>
<footer id="status" role="status"></footer>

<script>
"use strict";

const $ = (id) => document.getElementById(id);
const FEED_LIMIT = 200;
const DECISION_LIMIT = 200;
const RESOURCE_COLORS = { Rage: "--rage", Energy: "--energy", Mana: "--mana", Focus: "--focus" };
// Icons the server does not have (tools/fetch_icons.py not run): not asked for again.
const missingIcons = new Set();

let info = null;     // the iteration (seed as a string)
let frame = null;    // the latest frame from the server
let simTime = 0;     // the sim time shown; runs ahead of `frame` while playing
let playing = false;
let speed = 1;
let advancing = false;
let lastWall = null;

// Every request goes through one chain, so frames are applied in the order they were asked for.
let chain = Promise.resolve();
function enqueue(task) {
  chain = chain.then(task).catch(fail);
  return chain;
}

async function api(method, path, body) {
  const options = { method };
  if (body !== undefined) {
    options.headers = { "Content-Type": "application/json" };
    options.body = JSON.stringify(body);
  }
  const response = await fetch(path, options);
  if (!response.ok) {
    throw new Error(`${method} ${path}: ${response.status} ${await response.text()}`);
  }
  return response.json();
}

function fail(error) {
  setPlaying(false);
  $("status").textContent = String(error.message || error);
}

/** Starts the iteration of `seed` (a string) over, or of a new seed when it is null. */
function restart(seed) {
  setPlaying(false);
  return enqueue(async () => {
    info = await api("POST", "/api/restart", seed === null ? {} : { seed });
    $("feed").replaceChildren();
    $("stage").replaceChildren();
    $("status").textContent = "";
    $("last-event").textContent = "";
    $("name").textContent = info.name;
    $("sub").textContent =
      `${info.race} ${info.class} · ${info.rotation} · seed ${info.seed} · ` +
      `${info.combat_length} s ± ${info.length_variance} % (this one ${info.end_at.toFixed(1)} s)`;
    document.title = `${info.name} · csim-live`;
    renderEntries();
    simTime = info.start_at;
    apply(await api("POST", "/api/advance", { to: info.start_at }));
  });
}

function step(kind) {
  setPlaying(false);
  enqueue(async () => {
    const stepped = await api("POST", "/api/step", { kind });
    $("last-event").textContent = stepped.event || "";
    apply(stepped);
  });
}

function apply(next) {
  frame = next;
  addHits(next.damage);
  addDecisions(next.decisions);
  if (!playing || next.done) {
    simTime = next.time;
  }
  if (next.done) {
    setPlaying(false);
  }
  $("dps").textContent = next.dps.toFixed(1);
  $("total").textContent = next.total_damage.toLocaleString("en-US");
  for (const id of ["play", "step-event", "step-cast"]) {
    $(id).disabled = next.done;
  }
}

function addHits(hits) {
  const feed = $("feed");
  for (const hit of hits) {
    const item = document.createElement("li");
    item.className = hit.proc ? "proc"
      : (hit.auto ? "auto" : "spell") + (hit.critical ? " crit" : "") + (hit.miss ? " miss" : "");
    const icon = iconImage(hit.icon);
    if (icon) {
      item.append(icon);
    }
    item.append(hit.proc ? hit.name
      : hit.miss || (hit.critical ? `${hit.amount}*` : String(hit.amount)));
    const how = [hit.proc && "proc", hit.miss && hit.miss.toLowerCase(), hit.critical && "critical",
      hit.glancing && "glancing"].filter(Boolean).join(", ");
    item.title = `${hit.name} at ${clock(hit.time)}${how ? ` (${how})` : ""}`;
    feed.prepend(item);
  }
  while (feed.childElementCount > FEED_LIMIT) {
    feed.lastElementChild.remove();
  }
  floatHits(hits);
}

const FLOAT_LIMIT = 60;
/** The side the next non-crit slides to: 1 right, -1 left. */
let floatSide = 1;

/** The hits as damage numbers floating on the stage, as in the game. */
function floatHits(hits) {
  const stage = $("stage");
  for (const hit of hits) {
    if (hit.proc) {
      continue;
    }
    const number = element("span", `float ${hit.auto ? "auto" : "spell"}`,
      hit.miss || String(hit.amount));
    if (hit.miss) {
      number.classList.add("miss");
    }
    if (hit.critical) {
      number.classList.add("crit");
      number.style.setProperty("--y", `${45 + (Math.random() - 0.5) * 10}%`);
    } else {
      number.classList.add("hit");
      number.style.setProperty("--y", `${15 + Math.random() * 70}%`);
      number.style.setProperty("--dx", `${floatSide * (120 + Math.random() * 60)}px`);
      floatSide = -floatSide;
    }
    number.addEventListener("animationend", () => number.remove(), { once: true });
    stage.append(number);
  }
  while (stage.childElementCount > FLOAT_LIMIT) {
    stage.firstElementChild.remove();
  }
}

function element(tag, className, text) {
  const node = document.createElement(tag);
  if (className) {
    node.className = className;
  }
  if (text !== undefined) {
    node.textContent = text;
  }
  return node;
}

/** An 18 px cell holding the icon, kept empty without one so the rows stay aligned. */
function iconSlot(id) {
  const slot = element("span", "slot");
  const icon = iconImage(id);
  if (icon) {
    slot.append(icon);
  }
  return slot;
}

function entryName(entry) {
  return entry.rank === null ? entry.spell : `${entry.spell} (rank ${entry.rank})`;
}

/** The rotation's `cast_if` entries, in file order. */
function renderEntries() {
  $("entries-count").textContent = String(info.cast_if.length);
  $("entries-list").replaceChildren(...info.cast_if.map((entry) => {
    const item = element("li", entry.skipped === null ? "entry" : "entry skipped");
    item.dataset.position = String(entry.position);
    const name = entry.skipped === null ? entryName(entry) : `${entryName(entry)} — ${entry.skipped}`;
    item.append(
      element("span", "position", `#${entry.position}`),
      iconSlot(entry.icon),
      element("span", "spell", name),
      element("pre", "condition", entry.condition ?? "no condition"),
    );
    item.title = name;
    return item;
  }));
  $("decisions").replaceChildren();
}

/** What decided a cast: the condition of the entry that returned true, or how it was cast. */
function decidedBy(decision) {
  if (decision.by !== "entry") {
    return decision.by;
  }
  return info.cast_if[decision.entry - 1].condition ?? "no condition";
}

function addDecisions(decisions) {
  if (decisions.length === 0) {
    return;
  }
  const list = $("decisions");
  for (const decision of decisions) {
    const item = element("li", "decision");
    const name = element("span", "spell", decision.spell);
    if (decision.entry !== null) {
      name.append(element("span", "position", `#${decision.entry}`));
    }
    item.append(
      element("span", "when", clock(decision.time)),
      iconSlot(decision.icon),
      name,
      element("pre", "condition", decidedBy(decision)),
    );
    list.prepend(item);
  }
  while (list.childElementCount > DECISION_LIMIT) {
    list.lastElementChild.remove();
  }
  for (const item of list.querySelectorAll(".newest")) {
    item.classList.remove("newest");
  }
  list.firstElementChild.classList.add("newest");
  list.scrollTop = 0;

  const latest = decisions.findLast((decision) => decision.entry !== null);
  if (latest) {
    const entries = $("entries-list");
    for (const item of entries.children) {
      const isLatest = item.dataset.position === String(latest.entry);
      item.classList.toggle("latest", isLatest);
      if (isLatest && $("entries").open) {
        scrollIntoList(entries, item);
      }
    }
  }
}

/** Scrolls `list` (only it, never the page) just enough to show `item`. */
function scrollIntoList(list, item) {
  // The list is positioned, so offsetTop is relative to it.
  const top = item.offsetTop;
  const bottom = top + item.offsetHeight;
  if (top < list.scrollTop) {
    list.scrollTop = top;
  } else if (bottom > list.scrollTop + list.clientHeight) {
    list.scrollTop = bottom - list.clientHeight;
  }
}

function setPlaying(on) {
  playing = on && !(frame && frame.done);
  $("play").textContent = playing ? "Pause" : "Play";
  $("stage").classList.toggle("paused", !playing);
  lastWall = null;
}

/** `m:ss.mmm`, negative before the pull. */
function clock(time) {
  const sign = time < 0 ? "-" : "";
  const ms = Math.round(Math.abs(time) * 1000);
  const minutes = Math.floor(ms / 60000);
  const seconds = Math.floor((ms % 60000) / 1000);
  const millis = ms % 1000;
  return `${sign}${minutes}:${String(seconds).padStart(2, "0")}.${String(millis).padStart(3, "0")}`;
}

function seconds(left) {
  return left > 0 ? `${left.toFixed(1)} s` : "";
}

function fill(id, fraction, color) {
  const bar = $(id);
  bar.style.width = `${Math.max(0, Math.min(1, fraction)) * 100}%`;
  if (color) {
    bar.style.background = color;
  }
}

function swing(prefix, timer, time) {
  const span = timer.next - timer.last;
  const started = span > 0 && time >= 0;
  fill(`${prefix}-fill`, started ? (time - timer.last) / span : 0);
  $(`${prefix}-value`).textContent = started ? seconds(timer.next - time) : "";
}

/** An 18 px icon of `/icons/<id>.png`; null without an icon or when the server has none. */
function iconImage(id) {
  if (id === null || missingIcons.has(id)) {
    return null;
  }
  const image = document.createElement("img");
  image.className = "icon";
  image.alt = "";
  image.width = 18;
  image.height = 18;
  image.src = `/icons/${id}.png`;
  image.addEventListener("error", () => {
    missingIcons.add(id);
    image.remove();
  }, { once: true });
  return image;
}

function setText(element, text) {
  if (element.textContent !== text) {
    element.textContent = text;
  }
}

/** `name`, or `name#2`, `name#3`... for the repeats: a key per tile. */
function keyed(items) {
  const seen = new Map();
  return items.map((item) => {
    const count = (seen.get(item.name) || 0) + 1;
    seen.set(item.name, count);
    return { ...item, key: count === 1 ? item.name : `${item.name}#${count}` };
  });
}

function render() {
  if (!info || !frame) {
    return;
  }
  const time = simTime;
  const state = frame.state;
  $("clock").textContent = clock(time);
  fill("timeline-fill", (time - info.start_at) / (info.end_at - info.start_at));

  const resource = state.resource;
  $("resource-name").textContent = resource.kind;
  $("resource-label").textContent = resource.kind;
  fill("resource-fill", resource.current / resource.max,
    `var(${RESOURCE_COLORS[resource.kind] || "--accent"})`);
  $("resource-value").textContent = `${resource.current} / ${resource.max}`;

  $("pips-row").hidden = state.combo_points === null;
  if (state.combo_points !== null) {
    const pips = $("pips");
    if (pips.childElementCount !== 5) {
      pips.replaceChildren(...Array.from({ length: 5 }, () => {
        const pip = document.createElement("span");
        pip.className = "pip";
        return pip;
      }));
    }
    [...pips.children].forEach((pip, i) => pip.classList.toggle("on", i < state.combo_points));
    $("pips-value").textContent = String(state.combo_points);
  }
  $("stance-row").hidden = state.stance === null;
  $("stance").textContent = state.stance || "";

  const gcdLeft = state.gcd_end - time;
  swing("mh", state.mainhand, time);
  $("oh-row").hidden = state.offhand === null;
  if (state.offhand !== null) {
    swing("oh", state.offhand, time);
  }

  // A fixed order: the shortest base cooldown first, then by name.
  const cooldowns = keyed(state.cooldowns).map((cooldown) => ({
    ...cooldown,
    left: cooldown.ready_at === null ? 0 : Math.max(0, cooldown.ready_at - time),
  })).sort((a, b) => (a.duration ?? 0) - (b.duration ?? 0) || a.name.localeCompare(b.name));
  const gcd = Math.max(0, gcdLeft);
  renderTiles($("cooldowns"), cooldowns.map((cooldown) => {
    // A spell that waits for the global cooldown is swept for it while it ends later.
    const gcdLater = cooldown.on_gcd && gcd > cooldown.left;
    const fraction = gcdLater ? gcd / state.gcd : cooldown.left / cooldown.duration;
    return {
      key: cooldown.key,
      name: cooldown.name,
      icon: cooldown.icon,
      sweep: remainingSweep(fraction),
      left: cooldown.left > 0 && !gcdLater ? tileSeconds(cooldown.left) : "",
      count: "",
    };
  }));

  // The buffs running out first, the ones without a duration last.
  const buffs = [...state.buffs].sort((a, b) =>
    (a.expires_at ?? Infinity) - (b.expires_at ?? Infinity));
  renderTiles($("buffs"), keyed(buffs).map((buff) => {
    const left = buff.expires_at === null ? null : Math.max(0, buff.expires_at - time);
    const stacks = buff.stacks > 1 ? ` ×${buff.stacks}` : "";
    const charges = buff.charges > 0 ? ` (${buff.charges} charges)` : "";
    return {
      key: buff.key,
      name: buff.name + stacks + charges,
      icon: buff.icon,
      sweep: left === null ? "none" : elapsedSweep(1 - left / buff.duration),
      left: left === null ? "" : tileSeconds(left),
      count: buff.stacks > 1 ? String(buff.stacks) : buff.charges > 0 ? String(buff.charges) : "",
    };
  }));
}

/** A cooldown's sweep: the part still to come dark, clearing clockwise from 12 o'clock. */
function remainingSweep(fraction) {
  const clear = (1 - Math.max(0, Math.min(1, fraction))) * 360;
  return fraction > 0
    ? `conic-gradient(transparent ${clear}deg, rgba(0, 0, 0, 0.7) ${clear}deg)`
    : "none";
}

/** A buff's sweep: the part gone dark, growing clockwise from 12 o'clock. */
function elapsedSweep(fraction) {
  const dark = Math.max(0, Math.min(1, fraction)) * 360;
  return fraction > 0
    ? `conic-gradient(rgba(0, 0, 0, 0.7) ${dark}deg, transparent ${dark}deg)`
    : "none";
}

/** The tiles of each container, by key: kept from frame to frame so icons are not reloaded. */
const tileViews = new Map();

/** Shows `items` ({key, name, icon, sweep, left, count}) as the icon tiles of `container`. */
function renderTiles(container, items) {
  let views = tileViews.get(container);
  if (!views) {
    views = new Map();
    tileViews.set(container, views);
  }
  const keys = new Set(items.map((item) => item.key));
  for (const [key, view] of views) {
    if (!keys.has(key)) {
      view.root.remove();
      views.delete(key);
    }
  }
  const empty = container.querySelector(".empty");
  if (items.length === 0) {
    if (!empty) {
      container.append(element("div", "empty", "None"));
    }
    return;
  }
  if (empty) {
    empty.remove();
  }
  items.forEach((item, index) => {
    let view = views.get(item.key);
    if (!view) {
      view = tile(item);
      views.set(item.key, view);
    }
    if (container.children[index] !== view.root) {
      container.insertBefore(view.root, container.children[index] || null);
    }
    if (view.root.title !== item.name) {
      view.root.title = item.name;
    }
    if (view.sweepValue !== item.sweep) {
      view.sweepValue = item.sweep;
      view.sweep.style.background = item.sweep;
    }
    setText(view.left, item.left);
    setText(view.count, item.count);
  });
}

function tile(item) {
  const root = element("div", "tile");
  const image = iconImage(item.icon);
  const initials = element("span", "initials",
    item.name.split(/\s+/).map((word) => word[0]).join("").slice(0, 3));
  if (image) {
    image.addEventListener("error", () => root.prepend(initials), { once: true });
    root.append(image);
  } else {
    root.append(initials);
  }
  const sweep = element("div", "sweep");
  const left = element("span", "left");
  const count = element("span", "count");
  root.append(sweep, left, count);
  return { root, sweep, left, count, sweepValue: null };
}

/** Whole seconds from 10 s up, tenths below. */
function tileSeconds(left) {
  return left >= 10 ? String(Math.ceil(left)) : left.toFixed(1);
}

function tick(now) {
  if (playing && info) {
    if (lastWall !== null) {
      simTime = Math.min(simTime + ((now - lastWall) / 1000) * speed, info.end_at);
    }
    lastWall = now;
    if (!advancing && frame && simTime > frame.time) {
      advancing = true;
      const to = simTime;
      enqueue(async () => apply(await api("POST", "/api/advance", { to })))
        .finally(() => { advancing = false; });
    }
  }
  render();
  requestAnimationFrame(tick);
}

$("play").addEventListener("click", () => setPlaying(!playing));
$("speed").addEventListener("change", (event) => { speed = Number(event.target.value); });
$("step-event").addEventListener("click", () => step("event"));
$("step-cast").addEventListener("click", () => step("cast"));
$("restart").addEventListener("click", () => restart(info ? info.seed : null));
$("reseed").addEventListener("click", () => restart(null));

// A fresh start of the server's iteration, whatever an earlier page left of it.
api("GET", "/api/info").then((current) => restart(current.seed), fail);
requestAnimationFrame(tick);
</script>
</body>
</html>
